[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-knowledge-architect"
version = "0.1.0"
description = "High-Efficiency Local Markdown Knowledge Retrieval System"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "AI Knowledge Infrastructure Engineer" }
]
dependencies = [
    "PyYAML>=6.0",
    "tiktoken>=0.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
knowledge-cli = "knowledge_retrieval.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["knowledge_retrieval*"]
